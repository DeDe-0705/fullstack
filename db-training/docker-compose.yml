services:
  mysql:
    image: mysql:8.0
    container_name: mysql-train
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      # 首次启动时，自动执行挂载进来的 init.sql（建库 + 建表 + 初始数据）
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
